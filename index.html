<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CredCheck — See exactly which university credits transfer and what you're losing in dollars. AI-powered 3D credit transfer visualization for Canadian students." />
    <title>CredCheck — Credit Transfer Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --color-bg: #020817;
        --color-panel: rgba(15, 23, 42, 0.85);
        --color-border: #1e3a5f;
        --color-accent: #38bdf8;
        --color-green: #22c55e;
        --color-red: #ef4444;
        --color-yellow: #eab308;
        --color-text: #e2e8f0;
        --color-muted: #64748b;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; overflow: hidden; }
      body {
        height: 100%;
        overflow: hidden;
        background: #020817;
        background: var(--color-bg);
        color: #e2e8f0;
        color: var(--color-text);
        font-family: 'IBM Plex Sans', sans-serif;
      }
      #root { width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
